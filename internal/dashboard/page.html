<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vtree</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e2e5ea;
    --ink: #1c2128; --ink-2: #57606a; --ink-3: #8b949e;
    --good: #1a7f37; --warn: #9a6700; --bad: #cf222e;
    --good-bg: #dafbe1; --warn-bg: #fff8c5; --bad-bg: #ffebe9;
    --link: #0969da; --run: #1a7f37; --btn: #f3f4f6; --btn-border: #d0d7de;
    --overlay: rgba(20,24,30,.45); --console: #0d1117; --console-ink: #c9d1d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --ink: #e6edf3; --ink-2: #9da7b3; --ink-3: #6e7681;
      --good: #3fb950; --warn: #d29922; --bad: #f85149;
      --good-bg: #12261e; --warn-bg: #272115; --bad-bg: #2d1618;
      --link: #58a6ff; --run: #3fb950; --btn: #21262d; --btn-border: #30363d;
      --overlay: rgba(0,0,0,.6); --console: #010409; --console-ink: #c9d1d9;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 24px 6px; }
  header h1 { font-size: 18px; margin: 0; }
  .summary { color: var(--ink-2); font-size: 13px; }
  .meta { color: var(--ink-3); font-size: 12px; margin-left: auto; }
  .toolbar { padding: 4px 24px 12px; display: flex; gap: 10px; align-items: center; }
  input[type=search], input[type=text] {
    background: var(--surface); border: 1px solid var(--btn-border); color: var(--ink);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  input[type=search] { width: 220px; }
  button {
    background: var(--btn); border: 1px solid var(--btn-border); color: var(--ink);
    border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  button.primary { background: var(--good); border-color: var(--good); color: #fff; }
  button.danger  { background: var(--bad);  border-color: var(--bad);  color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.icon { padding: 3px 8px; font-size: 12px; }
  main { padding: 0 24px 32px; display: grid; gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .panel h2 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3);
              margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--border);
              display: flex; align-items: center; gap: 8px; }
  .panel h2 .spacer { margin-left: auto; }
  .repos { display: flex; gap: 18px; padding: 9px 12px; flex-wrap: wrap; font-size: 13px; }
  .repos .chip { color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  thead th { text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
             color: var(--ink-3); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 6px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  td.tree { font-weight: 600; white-space: nowrap; }
  td.branch { color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  td.actions { text-align: right; white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
           padding: 1px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .b-clean { color: var(--good); background: var(--good-bg); }
  .b-dirty { color: var(--warn); background: var(--warn-bg); }
  .b-risk  { color: var(--bad);  background: var(--bad-bg); }
  .flag { color: var(--ink-3); font-size: 12px; margin-left: 6px; font-weight: 400; }
  a.port { color: var(--link); text-decoration: none; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  a.port:hover { text-decoration: underline; }
  .live { color: var(--run); font-size: 11px; font-weight: 600; margin-left: 3px; }
  .off { color: var(--ink-3); }
  .err { color: var(--bad); padding: 16px 0; }

  /* modal */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none;
             align-items: flex-start; justify-content: center; padding-top: 9vh; z-index: 10; }
  .overlay.open { display: flex; }
  .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            width: min(680px, 92vw); max-height: 82vh; display: flex; flex-direction: column;
            box-shadow: 0 16px 48px rgba(0,0,0,.28); }
  .dialog header { padding: 14px 18px 8px; }
  .dialog h3 { margin: 0; font-size: 15px; }
  .dialog .body { padding: 8px 18px 14px; overflow-y: auto; display: grid; gap: 10px; }
  .dialog .row { display: flex; gap: 8px; align-items: center; }
  .dialog .foot { padding: 10px 18px 14px; display: flex; gap: 8px; justify-content: flex-end;
                  border-top: 1px solid var(--border); }
  .warnbox { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 6px;
             padding: 10px 12px; font-size: 13px; }
  .warnbox pre { margin: 6px 0 0; font-size: 12px; white-space: pre-wrap; max-height: 180px; overflow: auto; }
  .console { background: var(--console); color: var(--console-ink); border-radius: 6px;
             font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.45;
             padding: 10px 12px; min-height: 120px; max-height: 46vh; overflow-y: auto; white-space: pre-wrap; }
  .status-line { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--ink-3); border-top-color: transparent;
          border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  details.adv summary { color: var(--ink-2); font-size: 13px; cursor: pointer; }
  label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="ws">vtree</h1>
  <span class="summary" id="summary"></span>
  <span class="meta" id="meta"></span>
</header>
<div class="toolbar">
  <input type="search" id="filter" placeholder="Filter trees…" autocomplete="off">
  <button class="primary" id="newTreeBtn">＋ New tree</button>
</div>
<main>
  <div class="panel" id="repoPanel" hidden>
    <h2>Source repositories <span class="spacer"></span><button class="icon" id="installBtn" hidden>Install</button></h2>
    <div class="repos" id="repos"></div>
  </div>
  <div id="content" class="err"></div>
</main>

<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>

<script>
let data = null, meta = null;
const $ = id => document.getElementById(id);

/* ── data ─────────────────────────────────────────────────────────────── */

async function refresh() {
  try {
    const [s, m] = await Promise.all([fetch('/api/status'), fetch('/api/meta')]);
    if (!s.ok) throw new Error(await s.text());
    data = await s.json();
    meta = m.ok ? await m.json() : meta;
    render();
  } catch (e) {
    $('content').className = 'err';
    $('content').textContent = 'Cannot reach vtree: ' + e.message;
  }
}

/* ── rendering ────────────────────────────────────────────────────────── */

function badge(t) {
  if (t.unpushed > 0 || t.repos.some(r => r.error))
    return `<span class="badge b-risk">${t.repos.some(r => r.error) ? 'unverifiable' : t.unpushed + ' unpushed'}</span>`;
  if (t.dirty > 0) return `<span class="badge b-dirty">${t.dirty} dirty</span>`;
  return `<span class="badge b-clean">clean</span>`;
}
function flags(t) {
  const f = [];
  if (!t.has_manifest) f.push('no manifest');
  if (t.legacy) f.push('legacy: ' + t.legacy);
  if (t.ports_diverged) f.push('ports diverged');
  return f.map(x => `<span class="flag">${x}</span>`).join('');
}
function portCell(t) {
  if (!t.ports) return '<span class="off">—</span>';
  return Object.entries(t.ports).sort((a, b) => a[1] - b[1]).map(([name, p]) => {
    const on = t.listening && t.listening[name];
    return `<a class="port" href="http://localhost:${p}" target="_blank">:${p}</a>` +
           (on ? '<span class="live">●&nbsp;live</span>' : '');
  }).join(' &nbsp;');
}
function branchCell(t) {
  return [...new Set(t.repos.map(r => r.branch).filter(Boolean))].join(', ') || '?';
}
function actionCell(t) {
  const cmds = (meta && meta.commands || []).slice(0, 2)
    .map(c => `<button class="icon" onclick="runCmd('${c}','${t.name}')">${c}</button>`).join(' ');
  const adopt = t.has_manifest ? '' : `<button class="icon" onclick="doAdopt('${t.name}')">adopt</button> `;
  return `${adopt}${cmds} <button class="icon" onclick="askDelete('${t.name}')" title="remove tree">🗑</button>`;
}

function render() {
  if (!data) return;
  const q = $('filter').value.toLowerCase();
  const trees = data.trees.filter(t => !q || t.name.toLowerCase().includes(q) || branchCell(t).toLowerCase().includes(q));
  const dirty = data.trees.filter(t => t.dirty > 0).length;
  const unpushed = data.trees.filter(t => t.unpushed > 0).length;
  const live = data.trees.filter(t => t.listening && Object.values(t.listening).some(Boolean)).length;

  $('ws').textContent = data.workspace;
  $('summary').textContent = `${data.trees.length} trees · ${dirty} dirty · ${unpushed} unpushed · ${live} running`;
  $('meta').textContent = `vtree ${data.version} · refreshed ${new Date(data.generated_at).toLocaleTimeString()}`;

  if (meta && meta.repos) {
    $('repoPanel').hidden = false;
    $('repos').innerHTML = meta.repos.map(r =>
      `<span class="chip">${r.name} · ${r.base_ref}${r.installed ? '' : ' · <span style="color:var(--bad)">not installed</span>'}</span>`).join('');
    $('installBtn').hidden = meta.repos.every(r => r.installed);
  }

  $('content').className = 'panel';
  $('content').innerHTML = `
    <table>
      <thead><tr><th>State</th><th>Tree</th><th>Branch</th><th>Ports</th><th></th></tr></thead>
      <tbody>${trees.map(t => `
        <tr>
          <td>${badge(t)}</td>
          <td class="tree">${t.name}${flags(t)}</td>
          <td class="branch">${branchCell(t)}</td>
          <td>${portCell(t)}</td>
          <td class="actions">${actionCell(t)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

/* ── modal plumbing ───────────────────────────────────────────────────── */

let modalBusy = false;
function openModal(html) { $('dialog').innerHTML = html; $('overlay').classList.add('open'); }
function closeModal() { if (modalBusy) return; $('overlay').classList.remove('open'); refresh(); }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── op execution: POST an action, stream its output into a console ──── */

async function startAction(action, body, consoleEl, statusEl, opts = {}) {
  modalBusy = true;
  let id;
  try {
    const r = await fetch('/api/actions/' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) { id = j.running; statusEl.innerHTML = `<span class="spin"></span> attached to running: vtree ${j.args.join(' ')}`; }
    else if (!r.ok) throw new Error(j.error || r.statusText);
    else id = j.id;
  } catch (e) {
    modalBusy = false;
    statusEl.textContent = '✗ ' + e.message;
    return;
  }
  if (!statusEl.innerHTML) statusEl.innerHTML = `<span class="spin"></span> running…`;
  if (opts.onStart) opts.onStart(id);

  const es = new EventSource(`/api/ops/${id}/stream`);
  es.onmessage = ev => {
    consoleEl.textContent += ev.data + '\n';
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };
  es.addEventListener('done', ev => {
    es.close();
    modalBusy = false;
    const failed = JSON.parse(ev.data).failed;
    statusEl.innerHTML = failed ? '<span style="color:var(--bad)">✗ failed</span>'
                                : '<span style="color:var(--good)">✓ done</span>';
    if (opts.onDone) opts.onDone(failed);
    refresh();
  });
  es.onerror = () => { /* EventSource retries on its own */ };
}

function consoleBlock() {
  return `<div class="status-line" id="opStatus"></div><div class="console" id="opConsole"></div>`;
}

/* ── dialogs ──────────────────────────────────────────────────────────── */

$('newTreeBtn').onclick = () => {
  openModal(`
    <header><h3>New tree</h3></header>
    <div class="body">
      <div class="row"><input type="text" id="ntName" placeholder="tree name (e.g. fix-303)" style="flex:1" autofocus></div>
      <details class="adv"><summary>Advanced</summary>
        <div class="row" style="margin-top:8px">
          <input type="text" id="ntBase" placeholder="base ref override (default: workspace base_ref)" style="flex:1">
        </div>
      </details>
      <div id="ntRun" hidden>${consoleBlock()}</div>
    </div>
    <div class="foot">
      <button onclick="closeModal()">Close</button>
      <button class="primary" id="ntGo">Create</button>
    </div>`);
  $('ntName').focus();
  $('ntGo').onclick = () => {
    const name = $('ntName').value.trim();
    if (!name) return;
    $('ntGo').disabled = true; $('ntName').disabled = true;
    $('ntRun').hidden = false;
    startAction('up', { name, base: $('ntBase').value.trim() }, $('opConsole'), $('opStatus'),
      { onDone: failed => { if (!failed) $('ntGo').textContent = 'Created'; else { $('ntGo').disabled = false; $('ntGo').textContent = 'Retry'; $('ntName').disabled = false; } } });
  };
};

function runCmd(command, name) {
  openModal(`
    <header><h3>vtree ${command} ${name}</h3></header>
    <div class="body">${consoleBlock()}</div>
    <div class="foot">
      <button class="danger" id="opCancel" disabled>Stop</button>
      <button onclick="closeModal()">Close</button>
    </div>`);
  startAction('run', { command, name }, $('opConsole'), $('opStatus'), {
    onStart: id => {
      const b = $('opCancel');
      b.disabled = false;
      b.onclick = () => fetch(`/api/ops/${id}/cancel`, { method: 'POST' });
    },
    onDone: () => { $('opCancel').disabled = true; },
  });
}

function doAdopt(name) {
  openModal(`
    <header><h3>Adopt ${name}</h3></header>
    <div class="body">${consoleBlock()}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`);
  startAction('adopt', { name }, $('opConsole'), $('opStatus'));
}

$('installBtn').onclick = () => {
  openModal(`
    <header><h3>Install repositories</h3></header>
    <div class="body">${consoleBlock()}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`);
  startAction('install', {}, $('opConsole'), $('opStatus'));
};

async function askDelete(name) {
  openModal(`
    <header><h3>Remove ${name}</h3></header>
    <div class="body">
      <div>This removes the worktrees, the branch, both MySQL schemas, and frees the ports.</div>
      <div id="delRisk"><span class="spin"></span> checking for work at risk…</div>
      <div id="delRun" hidden>${consoleBlock()}</div>
    </div>
    <div class="foot">
      <button onclick="closeModal()">Cancel</button>
      <button class="danger" id="delGo" disabled>Remove</button>
    </div>`);

  let force = false;
  try {
    const states = await (await fetch('/api/inspect/' + encodeURIComponent(name))).json();
    const risky = states.filter(s => (s.dirty && s.dirty.length) || (s.unpushed && s.unpushed.length) || s.error);
    if (risky.length === 0) {
      $('delRisk').innerHTML = '<span class="badge b-clean">clean</span> — nothing unpushed, nothing uncommitted.';
      $('delGo').disabled = false;
    } else {
      force = true;
      const detail = risky.map(s => {
        let out = s.repo + ':\n';
        if (s.error) out += '  cannot verify: ' + s.error + '\n';
        (s.dirty || []).forEach(l => out += '  ' + l + '\n');
        (s.unpushed || []).forEach(l => out += '  unpushed: ' + l + '\n');
        return out;
      }).join('');
      $('delRisk').innerHTML = `
        <div class="warnbox">
          <strong>This work exists nowhere else and will be destroyed:</strong>
          <pre>${detail.replace(/</g, '&lt;')}</pre>
          <label class="check" style="margin-top:8px">
            <input type="checkbox" id="delAck">
            I understand these uncommitted and unpushed changes will be permanently lost
          </label>
        </div>`;
      $('delAck').onchange = () => { $('delGo').disabled = !$('delAck').checked; };
    }
  } catch (e) {
    $('delRisk').innerHTML = '<span class="err">Could not inspect: ' + e.message + '</span>';
  }

  $('delGo').onclick = () => {
    $('delGo').disabled = true;
    $('delRun').hidden = false;
    startAction('down', { name, force: force ? 'true' : 'false' }, $('opConsole'), $('opStatus'));
  };
}

/* ── boot ─────────────────────────────────────────────────────────────── */

$('filter').addEventListener('input', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh();
setInterval(() => { if (!document.hidden && !modalBusy) refresh(); }, 10000);
</script>
</body>
</html>
