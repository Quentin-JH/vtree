<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vtree</title>
<style>
  /* Velera design tokens — mirrors velera-crm web/src/index.css.
     Dark-first (void black, raised surfaces), gold CTA, teal positive,
     critical red. Status semantics: clean/live = teal, dirty = gold,
     unpushed/unverifiable = critical — always paired with a text label. */
  :root {
    --side: #fafafa; --bg: #ffffff; --card: #f2f2f2; --row: #f2f2f2;
    --border: #d8d8d8; --ink: #000000; --ink-2: #6b6b6b; --ink-3: #9e9e9e;
    --accent: #9a6e00; --accent-ink: #fcedc7;
    --good: #2e8577; --warn: #9a6e00; --bad: #d92d20;
    --chip: #ececec; --console: #0a0a0a; --console-ink: #d8d8d8;
    --overlay: rgba(0,0,0,.45); --hover: #ececec;
    --warn-bg: #fcedc7; --good-bg: #e2f1ee;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --side: #0a0a0a; --bg: #000000; --card: #141414; --row: #141414;
      --border: #2e2e2e; --ink: #ffffff; --ink-2: #9a9a9a; --ink-3: #666666;
      --accent: #ffc107; --accent-ink: #2a1d02;
      --good: #5db8ae; --warn: #ffc107; --bad: #f04438;
      --chip: #1f1f1f; --console: #0a0a0a; --console-ink: #d8d8d8;
      --overlay: rgba(0,0,0,.65); --hover: #1c1c1c;
      --warn-bg: #2a1d02; --good-bg: #10231f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); height: 100vh; display: flex;
         font: 14px/1.5 'Inter', ui-sans-serif, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── sidebar ── */
  aside { width: 250px; background: var(--side); border-right: 1px solid var(--border);
          display: flex; flex-direction: column; flex-shrink: 0; }
  aside .head { display: flex; align-items: center; justify-content: space-between;
                padding: 20px 16px 10px; }
  aside .head span { font-size: 11px; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
  .wsitem { margin: 2px 10px; padding: 9px 12px; border-radius: 8px; cursor: default; }
  .wsitem.sel { background: var(--accent); color: var(--accent-ink); }
  .wsitem .n { font-weight: 600; font-size: 13.5px; }
  .wsitem .s { font-size: 12px; opacity: .8; }
  aside .foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); }
  aside .foot button { background: none; border: none; color: var(--ink-2); font: inherit;
                       font-size: 13px; cursor: pointer; padding: 4px 0; }
  aside .foot button:hover { color: var(--ink); }

  /* ── main ── */
  .main { flex: 1; overflow-y: auto; padding: 26px 32px 48px; }
  .titlebar { display: flex; align-items: flex-start; gap: 10px; }
  .titlebar h1 { margin: 0; font-size: 22px; font-family: 'Sora', 'Inter', ui-sans-serif, sans-serif; }
  .titlebar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .path { color: var(--ink-3); font-size: 12.5px; margin: 2px 0 14px; }
  .stats { display: flex; gap: 56px; padding: 6px 0 18px; border-bottom: 1px solid var(--border);
           font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .stats b { color: var(--ink); font-weight: 600; margin-left: 6px; }

  .sect { display: flex; align-items: center; gap: 8px; margin: 22px 0 8px; }
  .sect span { font-size: 11px; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
  .sect .tools { margin-left: auto; display: flex; gap: 6px; }

  .repo-row { background: var(--row); border: 1px solid var(--border); border-radius: 8px;
              display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin-bottom: 6px; }
  .repo-row .name { font-weight: 600; font-size: 13.5px; }
  .chip { background: var(--chip); color: var(--ink-2); border-radius: 5px; padding: 1px 7px;
          font-size: 11.5px; }
  .repo-row .right { margin-left: auto; font-size: 12.5px; }
  .behind { color: var(--warn); font-weight: 600; }
  .uptodate { color: var(--good); }
  .notinstalled { color: var(--bad); }

  .group-label { font-size: 11px; letter-spacing: .08em; color: var(--ink-3); font-weight: 600;
                 margin: 16px 0 8px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
           overflow: hidden; margin-bottom: 6px; }
  table { border-collapse: collapse; width: 100%; }
  thead th { text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
             color: var(--ink-3); font-weight: 600; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 6px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  td.tree { font-weight: 600; white-space: nowrap; font-size: 13.5px; }
  td.branch { color: var(--ink-2); font-size: 12.5px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
          padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; }
  .card .body { flex: 1; min-width: 0; }
  .card h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .flag { color: var(--ink-3); font-size: 11.5px; font-weight: 400; }
  .rline { display: flex; align-items: baseline; gap: 8px; font-size: 13px; margin: 2px 0; }
  .rline .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; position: relative; top: 0; }
  .d-good { background: var(--good); } .d-warn { background: var(--warn); } .d-bad { background: var(--bad); }
  .rline .rname { color: var(--ink-2); }
  .rline .st { color: var(--ink-2); }
  .pline { margin-top: 8px; font-size: 12.5px; }
  a.port { color: var(--accent); text-decoration: none; }
  a.port:hover { text-decoration: underline; }
  .live { color: var(--good); font-size: 11px; font-weight: 700; margin: 0 8px 0 3px; }
  .card .acts { display: flex; gap: 6px; align-items: flex-start; }

  button { background: var(--card); border: 1px solid var(--border); color: var(--ink);
           border-radius: 7px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.icon { padding: 4px 9px; font-size: 12px; color: var(--ink-2); }
  input[type=search], input[type=text] {
    background: var(--card); border: 1px solid var(--border); color: var(--ink);
    border-radius: 7px; padding: 6px 10px; font: inherit;
  }
  .err { color: var(--bad); padding: 14px 0; }

  /* ── modal ── */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none;
             align-items: flex-start; justify-content: center; padding-top: 9vh; z-index: 10; }
  .overlay.open { display: flex; }
  .dialog { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            width: min(680px, 92vw); max-height: 82vh; display: flex; flex-direction: column;
            box-shadow: 0 16px 48px rgba(0,0,0,.35); }
  .dialog header { padding: 16px 20px 8px; }
  .dialog h3 { margin: 0; font-size: 15px; }
  .dialog .dbody { padding: 8px 20px 14px; overflow-y: auto; display: grid; gap: 10px; }
  .dialog .row { display: flex; gap: 8px; align-items: center; }
  .dialog .foot { padding: 10px 20px 16px; display: flex; gap: 8px; justify-content: flex-end;
                  border-top: 1px solid var(--border); }
  .warnbox { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 8px;
             padding: 10px 12px; font-size: 13px; }
  .warnbox pre { margin: 6px 0 0; font-size: 12px; white-space: pre-wrap; max-height: 180px; overflow: auto; }
  .cleanbox { background: var(--good-bg); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--good); }
  .console { background: var(--console); color: var(--console-ink); border-radius: 8px;
             font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.45;
             padding: 10px 12px; min-height: 110px; max-height: 44vh; overflow-y: auto; white-space: pre-wrap; }
  .status-line { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--ink-3); border-top-color: transparent;
          border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  details.adv summary { color: var(--ink-2); font-size: 13px; cursor: pointer; }
  label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
</style>
</head>
<body>
<aside>
  <div class="head"><span>WORKSPACES</span></div>
  <div class="wsitem sel"><div class="n" id="sideName">…</div><div class="s" id="sideSub"></div></div>
  <div class="foot"><button id="settingsBtn">⚙ Settings</button></div>
</aside>

<div class="main">
  <div class="titlebar">
    <div>
      <h1 id="wsTitle">…</h1>
      <div class="path mono" id="wsPath"></div>
    </div>
    <div class="right">
      <input type="search" id="filter" placeholder="Filter…" autocomplete="off" style="width:170px">
      <button class="primary" id="newTreeBtn">＋ New Tree</button>
    </div>
  </div>

  <div class="stats">
    <span>Repos:<b id="statRepos">–</b></span>
    <span>Branch prefix:<b class="mono" id="statPrefix">–</b></span>
    <span>Base port:<b class="mono" id="statPort">–</b></span>
    <span id="statMeta" style="margin-left:auto;color:var(--ink-3)"></span>
  </div>

  <div class="sect"><span>SOURCE REPOSITORIES</span>
    <div class="tools">
      <button class="icon" id="refreshBtn" title="git fetch every source repo">⟳ Refresh</button>
      <button class="icon" id="installBtn" hidden>Install</button>
    </div>
  </div>
  <div id="repoRows"></div>

  <div id="flightSect" hidden>
    <div class="sect"><span id="flightLabel">IN FLIGHT</span></div>
    <div id="flightCards"></div>
  </div>

  <div id="cleanSect" hidden>
    <div class="sect"><span id="cleanLabel">CLEAN</span></div>
    <div class="panel"><table>
      <thead><tr><th>Tree</th><th>Branch</th><th>Ports</th><th></th></tr></thead>
      <tbody id="cleanRows"></tbody>
    </table></div>
  </div>

  <div id="emptyMsg" class="err" hidden></div>
</div>

<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>

<script>
let data = null, meta = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* ── data ── */
async function refresh() {
  try {
    const [s, m] = await Promise.all([fetch('/api/status'), fetch('/api/meta')]);
    if (!s.ok) throw new Error(await s.text());
    data = await s.json();
    meta = m.ok ? await m.json() : meta;
    render();
  } catch (e) {
    $('treeGroups').className = 'err';
    $('treeGroups').textContent = 'Cannot reach vtree: ' + e.message;
  }
}

/* ── rendering ── */
function repoStatusLines(t) {
  return t.repos.map(r => {
    const parts = [];
    if (r.error) parts.push('cannot verify');
    if (r.dirty && r.dirty.length) parts.push(r.dirty.length + ' dirty');
    if (r.unpushed && r.unpushed.length) parts.push(r.unpushed.length + ' unpushed');
    if (r.ahead) parts.push(r.ahead + ' ahead');
    const dot = r.error || (r.unpushed && r.unpushed.length) ? 'd-bad'
              : (r.dirty && r.dirty.length) ? 'd-warn' : 'd-good';
    return `<div class="rline"><span class="dot ${dot}"></span>
      <span class="rname mono">${esc(r.repo)}:</span>
      <span class="st">${parts.length ? esc(parts.join(', ')) : 'up to date'}</span></div>`;
  }).join('');
}
function cardFlags(t) {
  const f = [];
  if (!t.has_manifest) f.push('no manifest');
  if (t.legacy) f.push('legacy: ' + t.legacy);
  if (t.ports_diverged) f.push('ports diverged');
  return f.map(x => `<span class="flag">${esc(x)}</span>`).join('');
}
function cardTitle(t) {
  if (t.display_name)
    return `${esc(t.display_name)} <span class="mono" style="color:var(--ink-3);font-size:12.5px;font-weight:400">(${esc(t.name)})</span>`;
  return esc(t.name);
}
function rowActions(t) {
  const cmds = (meta && meta.commands || []).slice(0, 2)
    .map(c => `<button class="icon" onclick="runCmd('${c}','${t.name}')">${c}</button>`).join('');
  const adopt = t.has_manifest ? '' : `<button class="icon" onclick="doAdopt('${t.name}')">adopt</button>`;
  const rename = t.has_manifest ? `<button class="icon" onclick="askRename('${t.name}')" title="set display name">✎</button>` : '';
  return `${adopt}${cmds}${rename}<button class="icon" onclick="askDelete('${t.name}')" title="remove tree">🗑</button>`;
}
function portsInline(t) {
  if (!t.ports) return '<span class="off">—</span>';
  return Object.entries(t.ports).sort((a, b) => a[1] - b[1]).map(([name, p]) => {
    const on = t.listening && t.listening[name];
    return `<a class="port mono" href="http://localhost:${p}" target="_blank">:${p}</a>` +
           (on ? '<span class="live">● LIVE</span>' : ' ');
  }).join(' ');
}
function card(t) {
  return `<div class="card">
    <div class="body">
      <h3>${cardTitle(t)}${cardFlags(t)}</h3>
      ${repoStatusLines(t)}
      <div class="pline">${portsInline(t)}</div>
    </div>
    <div class="acts">${rowActions(t)}</div>
  </div>`;
}

function askRename(name) {
  const t = data.trees.find(x => x.name === name) || {};
  openModal(`
    <header><h3>Display name for <span class="mono">${esc(name)}</span></h3></header>
    <div class="dbody">
      <div class="row"><input type="text" id="rnVal" placeholder="e.g. Crew Contribution Tracking" style="flex:1"
        value="${esc(t.display_name || '')}"></div>
      <div style="font-size:12.5px;color:var(--ink-3)">A label only — the directory, branch, and schemas keep
      the tree name. Leave empty to clear.</div>
      <div id="rnErr" class="err" style="padding:0" hidden></div>
    </div>
    <div class="foot">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" id="rnGo">Save</button>
    </div>`);
  $('rnVal').focus();
  const save = async () => {
    try {
      const r = await fetch('/api/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, display: $('rnVal').value }) });
      if (!r.ok) throw new Error(await r.text());
      closeModal();
    } catch (e) { $('rnErr').hidden = false; $('rnErr').textContent = e.message; }
  };
  $('rnGo').onclick = save;
  $('rnVal').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
}
function inFlight(t) {
  return t.dirty > 0 || t.unpushed > 0 ||
         t.repos.some(r => r.ahead > 0 || r.error) ||
         (t.listening && Object.values(t.listening).some(Boolean));
}

function render() {
  if (!data || !meta) return;
  const q = $('filter').value.toLowerCase();
  const match = t => !q || t.name.toLowerCase().includes(q) ||
    (t.display_name || '').toLowerCase().includes(q) ||
    t.repos.some(r => (r.branch || '').toLowerCase().includes(q));

  $('sideName').textContent = meta.name;
  $('sideSub').textContent = data.trees.length + ' trees';
  $('wsTitle').textContent = meta.name;
  $('wsPath').textContent = meta.path;
  $('statRepos').textContent = meta.repos.length;
  $('statPrefix').textContent = meta.branch_prefix || '—';
  $('statPort').textContent = meta.base_port || '—';
  $('statMeta').textContent = `vtree ${data.version} · ${new Date(data.generated_at).toLocaleTimeString()}`;

  $('repoRows').innerHTML = meta.repos.map(r => {
    let right;
    if (!r.installed) right = '<span class="notinstalled">not installed</span>';
    else if (r.behind > 0) right = `<span class="behind">↓ ${r.behind}</span>`;
    else right = '<span class="uptodate">up to date</span>';
    return `<div class="repo-row"><span class="name">${esc(r.name)}</span>
      <span class="chip mono">${esc(r.branch || '?')}</span>
      <span class="chip mono" title="trees are cut from this ref">${esc(r.base_ref)}</span>
      <span class="right">${right}</span></div>`;
  }).join('');
  $('installBtn').hidden = meta.repos.every(r => r.installed);

  const trees = data.trees.filter(match);
  const fly = trees.filter(inFlight), clean = trees.filter(t => !inFlight(t));

  $('flightSect').hidden = fly.length === 0;
  $('flightLabel').textContent = `IN FLIGHT (${fly.length})`;
  $('flightCards').innerHTML = fly.map(card).join('');

  $('cleanSect').hidden = clean.length === 0;
  $('cleanLabel').textContent = `CLEAN (${clean.length})`;
  $('cleanRows').innerHTML = clean.map(t => `
    <tr>
      <td class="tree">${cardTitle(t)}${cardFlags(t)}</td>
      <td class="branch mono">${esc([...new Set(t.repos.map(r => r.branch).filter(Boolean))].join(', ') || '?')}</td>
      <td>${portsInline(t)}</td>
      <td class="actions" style="text-align:right;white-space:nowrap">${rowActions(t)}</td>
    </tr>`).join('');

  $('emptyMsg').hidden = trees.length > 0;
  $('emptyMsg').textContent = data.trees.length === 0 ? 'no trees yet — ＋ New Tree' : 'no trees match the filter';
}

/* ── modal plumbing ── */
let modalBusy = false;
function openModal(html) { $('dialog').innerHTML = html; $('overlay').classList.add('open'); }
function closeModal() { if (modalBusy) return; $('overlay').classList.remove('open'); refresh(); }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── ops ── */
async function startAction(action, body, consoleEl, statusEl, opts = {}) {
  modalBusy = true;
  let id;
  try {
    const r = await fetch('/api/actions/' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) { id = j.running; statusEl.innerHTML = `<span class="spin"></span> attached to running: vtree ${esc(j.args.join(' '))}`; }
    else if (!r.ok) throw new Error(j.error || r.statusText);
    else id = j.id;
  } catch (e) {
    modalBusy = false;
    statusEl.textContent = '✗ ' + e.message;
    return;
  }
  if (!statusEl.innerHTML) statusEl.innerHTML = `<span class="spin"></span> running…`;
  if (opts.onStart) opts.onStart(id);

  const es = new EventSource(`/api/ops/${id}/stream`);
  es.onmessage = ev => {
    consoleEl.textContent += ev.data + '\n';
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };
  es.addEventListener('done', ev => {
    es.close();
    modalBusy = false;
    const failed = JSON.parse(ev.data).failed;
    statusEl.innerHTML = failed ? '<span style="color:var(--bad)">✗ failed</span>'
                                : '<span style="color:var(--good)">✓ done</span>';
    if (opts.onDone) opts.onDone(failed);
    refresh();
  });
  es.onerror = () => {};
}
function consoleBlock() {
  return `<div class="status-line" id="opStatus"></div><div class="console" id="opConsole"></div>`;
}

/* ── dialogs ── */
$('newTreeBtn').onclick = () => {
  openModal(`
    <header><h3>New tree</h3></header>
    <div class="dbody">
      <div class="row"><input type="text" id="ntName" placeholder="tree name (e.g. fix-303)" style="flex:1"></div>
      <details class="adv"><summary>Advanced</summary>
        <div class="row" style="margin-top:8px">
          <input type="text" id="ntBase" placeholder="base ref override (default: workspace base_ref)" style="flex:1">
        </div>
      </details>
      <div id="ntRun" hidden>${consoleBlock()}</div>
    </div>
    <div class="foot">
      <button onclick="closeModal()">Close</button>
      <button class="primary" id="ntGo">Create</button>
    </div>`);
  $('ntName').focus();
  $('ntGo').onclick = () => {
    const name = $('ntName').value.trim();
    if (!name) return;
    $('ntGo').disabled = true; $('ntName').disabled = true;
    $('ntRun').hidden = false;
    startAction('up', { name, base: $('ntBase').value.trim() }, $('opConsole'), $('opStatus'),
      { onDone: failed => { if (!failed) $('ntGo').textContent = 'Created'; else { $('ntGo').disabled = false; $('ntGo').textContent = 'Retry'; $('ntName').disabled = false; } } });
  };
};

function runCmd(command, name) {
  openModal(`
    <header><h3 class="mono">vtree ${esc(command)} ${esc(name)}</h3></header>
    <div class="dbody">${consoleBlock()}</div>
    <div class="foot">
      <button class="danger" id="opCancel" disabled>Stop</button>
      <button onclick="closeModal()">Close</button>
    </div>`);
  startAction('run', { command, name }, $('opConsole'), $('opStatus'), {
    onStart: id => {
      const b = $('opCancel');
      b.disabled = false;
      b.onclick = () => fetch(`/api/ops/${id}/cancel`, { method: 'POST' });
    },
    onDone: () => { $('opCancel').disabled = true; },
  });
}

function doAdopt(name) {
  openModal(`
    <header><h3>Adopt ${esc(name)}</h3></header>
    <div class="dbody">${consoleBlock()}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`);
  startAction('adopt', { name }, $('opConsole'), $('opStatus'));
}

$('installBtn').onclick = () => {
  openModal(`
    <header><h3>Install repositories</h3></header>
    <div class="dbody">${consoleBlock()}</div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`);
  startAction('install', {}, $('opConsole'), $('opStatus'));
};

$('refreshBtn').onclick = async () => {
  $('refreshBtn').disabled = true; $('refreshBtn').textContent = '⟳ Fetching…';
  try { await fetch('/api/refresh', { method: 'POST' }); } catch (e) {}
  $('refreshBtn').disabled = false; $('refreshBtn').textContent = '⟳ Refresh';
  refresh();
};

$('settingsBtn').onclick = () => {
  openModal(`
    <header><h3>Settings</h3></header>
    <div class="dbody" style="font-size:13px">
      <div>vtree <b>${esc(data ? data.version : '')}</b></div>
      <div class="mono" style="color:var(--ink-2)">${esc(meta ? meta.path : '')}</div>
      <div><a class="port" href="https://github.com/Quentin-JH/vtree/releases" target="_blank">Releases & downloads</a></div>
      <div style="color:var(--ink-3)">Theme follows your system (light/dark). The server runs as a
      login service — <span class="mono">vtree ui --uninstall</span> removes it.</div>
    </div>
    <div class="foot"><button onclick="closeModal()">Close</button></div>`);
};

async function askDelete(name) {
  openModal(`
    <header><h3>Remove ${esc(name)}</h3></header>
    <div class="dbody">
      <div style="font-size:13px">This removes the worktrees, the branch, both MySQL schemas, and frees the ports.</div>
      <div id="delRisk"><span class="spin"></span> checking for work at risk…</div>
      <div id="delRun" hidden>${consoleBlock()}</div>
    </div>
    <div class="foot">
      <button onclick="closeModal()">Cancel</button>
      <button class="danger" id="delGo" disabled>Remove</button>
    </div>`);

  let force = false;
  try {
    const states = await (await fetch('/api/inspect/' + encodeURIComponent(name))).json();
    const risky = states.filter(s => (s.dirty && s.dirty.length) || (s.unpushed && s.unpushed.length) || s.error);
    if (risky.length === 0) {
      $('delRisk').innerHTML = '<div class="cleanbox">Clean — nothing unpushed, nothing uncommitted.</div>';
      $('delGo').disabled = false;
    } else {
      force = true;
      const detail = risky.map(s => {
        let out = s.repo + ':\n';
        if (s.error) out += '  cannot verify: ' + s.error + '\n';
        (s.dirty || []).forEach(l => out += '  ' + l + '\n');
        (s.unpushed || []).forEach(l => out += '  unpushed: ' + l + '\n');
        return out;
      }).join('');
      $('delRisk').innerHTML = `
        <div class="warnbox">
          <strong>This work exists nowhere else and will be destroyed:</strong>
          <pre>${esc(detail)}</pre>
          <label class="check" style="margin-top:8px">
            <input type="checkbox" id="delAck">
            I understand these uncommitted and unpushed changes will be permanently lost
          </label>
        </div>`;
      $('delAck').onchange = () => { $('delGo').disabled = !$('delAck').checked; };
    }
  } catch (e) {
    $('delRisk').innerHTML = '<span class="err">Could not inspect: ' + esc(e.message) + '</span>';
  }

  $('delGo').onclick = () => {
    $('delGo').disabled = true;
    $('delRun').hidden = false;
    startAction('down', { name, force: force ? 'true' : 'false' }, $('opConsole'), $('opStatus'));
  };
}

/* ── boot ── */
$('filter').addEventListener('input', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh();
setInterval(() => { if (!document.hidden && !modalBusy) refresh(); }, 10000);
</script>
